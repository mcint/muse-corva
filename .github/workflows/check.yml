name: check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check (manifest, frontmatter, secrets)
        run: scripts/check.sh
      - name: test (token minting)
        run: scripts/test.sh
      - name: test (gh/git shims)
        run: scripts/test-shims.sh
      - name: test (secret checks)
        run: scripts/test-check.sh
      - name: test (pages-wait)
        run: python3 -m unittest discover -s tests -v
